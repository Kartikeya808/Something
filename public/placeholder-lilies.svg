<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="800" height="1000">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fdeef1"/>
      <stop offset="1" stop-color="#e9c7d4"/>
    </linearGradient>
    <radialGradient id="petal" cx="50%" cy="30%" r="75%">
      <stop offset="0" stop-color="#fffdf8"/>
      <stop offset="55%" stop-color="#fbe6ec"/>
      <stop offset="100%" stop-color="#f3c0d0"/>
    </radialGradient>
    <linearGradient id="leaf" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9fc093"/>
      <stop offset="1" stop-color="#6f9a68"/>
    </linearGradient>
  </defs>

  <rect width="800" height="1000" fill="url(#bg)"/>

  <!-- stems -->
  <g stroke="url(#leaf)" stroke-width="10" fill="none" stroke-linecap="round">
    <path d="M400 980 C 380 760 360 600 400 440"/>
    <path d="M400 860 C 300 760 250 700 230 560"/>
    <path d="M400 820 C 520 740 560 660 580 540"/>
  </g>
  <!-- leaves -->
  <g fill="url(#leaf)" opacity="0.92">
    <path d="M400 760 C 300 700 240 720 210 640 C 320 620 380 680 400 760 Z"/>
    <path d="M400 700 C 500 650 560 670 590 600 C 480 575 420 625 400 700 Z"/>
  </g>

  <!-- a lily bloom -->
  <g transform="translate(400 360)">
    <g fill="url(#petal)" stroke="#e7a9bc" stroke-width="2">
      <path d="M0 0 C -40 -140 -10 -250 0 -300 C 10 -250 40 -140 0 0 Z"/>
      <path transform="rotate(72)" d="M0 0 C -40 -140 -10 -250 0 -300 C 10 -250 40 -140 0 0 Z"/>
      <path transform="rotate(144)" d="M0 0 C -40 -140 -10 -250 0 -300 C 10 -250 40 -140 0 0 Z"/>
      <path transform="rotate(216)" d="M0 0 C -40 -140 -10 -250 0 -300 C 10 -250 40 -140 0 0 Z"/>
      <path transform="rotate(288)" d="M0 0 C -40 -140 -10 -250 0 -300 C 10 -250 40 -140 0 0 Z"/>
    </g>
    <!-- stamens -->
    <g stroke="#d98aa6" stroke-width="5" stroke-linecap="round">
      <line x1="0" y1="0" x2="0" y2="-120"/>
      <line x1="0" y1="0" x2="-55" y2="-95"/>
      <line x1="0" y1="0" x2="55" y2="-95"/>
    </g>
    <g fill="#c86f94">
      <circle cx="0" cy="-124" r="9"/>
      <circle cx="-58" cy="-98" r="9"/>
      <circle cx="58" cy="-98" r="9"/>
    </g>
    <circle cx="0" cy="0" r="16" fill="#f6d365"/>
  </g>

  <!-- a second smaller bloom -->
  <g transform="translate(250 540) scale(0.6)">
    <g fill="url(#petal)" stroke="#e7a9bc" stroke-width="2" opacity="0.95">
      <path d="M0 0 C -40 -140 -10 -250 0 -300 C 10 -250 40 -140 0 0 Z"/>
      <path transform="rotate(72)" d="M0 0 C -40 -140 -10 -250 0 -300 C 10 -250 40 -140 0 0 Z"/>
      <path transform="rotate(144)" d="M0 0 C -40 -140 -10 -250 0 -300 C 10 -250 40 -140 0 0 Z"/>
      <path transform="rotate(216)" d="M0 0 C -40 -140 -10 -250 0 -300 C 10 -250 40 -140 0 0 Z"/>
      <path transform="rotate(288)" d="M0 0 C -40 -140 -10 -250 0 -300 C 10 -250 40 -140 0 0 Z"/>
    </g>
    <circle cx="0" cy="0" r="16" fill="#f6d365"/>
  </g>

  <text x="400" y="945" text-anchor="middle" font-family="Georgia, serif" font-style="italic"
        font-size="30" fill="#b76b85" opacity="0.7">placeholder — drop portrait.jpg in /public</text>
</svg>
